name: Web CI

# Scoped to woofalk-app only. No deploy job here: the front-end deploys via
# Vercel's own GitHub integration (see CLAUDE.md), decoupled from this repo's
# Actions — this workflow is just the test/build/bundle-budget gate.
on:
  push:
    paths:
      - "woofalk-app/**"
      - ".github/workflows/web-ci.yml"
  pull_request:
    paths:
      - "woofalk-app/**"
      - ".github/workflows/web-ci.yml"

defaults:
  run:
    working-directory: woofalk-app

# Least-privilege default: this workflow only reads the repo and runs local
# scripts, it never writes back to GitHub.
permissions:
  contents: read

jobs:
  test:
    name: Test, build & bundle budget
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: woofalk-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Fails the build if the entry chunk grows past scripts/check-bundle-size.mjs's
      # budget — see that file for the current threshold and why it was picked.
      - name: Check bundle size budget
        run: npm run check:bundle-size

      # Informational only, same rationale as Pint/composer audit on the API
      # side: surfaces known vulnerable packages without gating the build on
      # an advisory the team hasn't triaged yet.
      - name: Audit dependencies (npm audit)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
