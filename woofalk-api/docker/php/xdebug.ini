; Xdebug is installed in the dev image but stays off by default (near-zero
; overhead) so `docker compose up` stays fast. Enable it per-run with:
;   docker compose exec -e XDEBUG_MODE=debug api php artisan ...
xdebug.mode=${XDEBUG_MODE}
xdebug.start_with_request=yes
xdebug.client_host=host.docker.internal
xdebug.client_port=9003
xdebug.discover_client_host=false
