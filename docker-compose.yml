services:
  api:
    build:
      context: ./woofalk-api
      target: dev
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    restart: unless-stopped
    # Blocks a compromised process from gaining more privileges than it
    # started with (e.g. via a setuid-root binary) — doesn't interfere with
    # the normal root→app-user privilege *drop* nginx/php-fpm/mysql each do
    # on their own startup, only with privilege *escalation* afterwards.
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./woofalk-api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gowithdog
      DB_USERNAME: gowithdog
      DB_PASSWORD: gowithdog
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [gowithdog]

  api-nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./woofalk-api:/var/www/html:ro
      - ./woofalk-api/docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api
    networks: [gowithdog]

  web:
    build:
      context: ./woofalk-app
      target: dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./woofalk-app:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api-nginx
    networks: [gowithdog]

  db:
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MYSQL_DATABASE: gowithdog
      MYSQL_USER: gowithdog
      MYSQL_PASSWORD: gowithdog
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Bound to localhost only: this is MySQL with well-known dev
      # credentials (gowithdog/gowithdog/root, public in this repo's
      # history) — publishing on 0.0.0.0 would expose it to anyone on the
      # same network as the dev machine.
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gowithdog]

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8025:8025" # web UI: http://localhost:8025
      - "127.0.0.1:1025:1025" # smtp
    networks: [gowithdog]

volumes:
  db_data:
  web_node_modules:
  api_vendor:

networks:
  gowithdog:
