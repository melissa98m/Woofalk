services:
  api:
    build:
      context: ./go-with-dog-api
      target: dev
      args:
        WWWUSER: ${WWWUSER:-1000}
        WWWGROUP: ${WWWGROUP:-1000}
    volumes:
      - ./go-with-dog-api:/var/www/html
      - api_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: gowithdog
      DB_USERNAME: gowithdog
      DB_PASSWORD: gowithdog
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    networks: [gowithdog]

  api-nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./go-with-dog-api:/var/www/html:ro
      - ./go-with-dog-api/docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8000:80"
    depends_on:
      - api
    networks: [gowithdog]

  web:
    build:
      context: ./go-with-dog-app
      target: dev
    volumes:
      - ./go-with-dog-app:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api-nginx
    networks: [gowithdog]

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [gowithdog]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025" # web UI: http://localhost:8025
      - "1025:1025" # smtp
    networks: [gowithdog]

volumes:
  db_data:
  web_node_modules:
  api_vendor:

networks:
  gowithdog:
