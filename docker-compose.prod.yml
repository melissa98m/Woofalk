# Production-shaped overlay: immutable images (no host bind mounts of source),
# optimized builds, no auto-migrate on boot. Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# nginx still needs to read public/ (and storage/app/public, via the
# storage:link symlink) to serve uploads and static files, but the prod api
# image is immutable, so instead of bind-mounting the host source tree we
# share a named volume between api and api-nginx. Docker seeds a fresh named
# volume from the image's contents on first run. If you rebuild the api image
# with new static assets, recreate the volume to pick them up:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml down
#   docker volume rm gowithdog_api_html
services:
  api:
    build:
      target: prod
    volumes: !override
      - api_html:/var/www/html
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      WAIT_FOR_DB: "true"
      RUN_MIGRATIONS: "false"

  api-nginx:
    volumes: !override
      - api_html:/var/www/html:ro
      - ./go-with-dog-api/docker/nginx/api.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

  web:
    build:
      target: prod
    volumes: !reset null
    environment: !reset null
    ports: !override
      - "3000:80"

  db:
    ports: !reset null

volumes:
  api_html:
